name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python examples/control_plane_demo.py
      - run: python -m compileall -q swe_pilot tests examples scripts runner/checks.py
      - run: bash -n bin/swe-firewall runner/run.sh runner/mock/mock.sh
      - run: python scripts/check_public_release.py
