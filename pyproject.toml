[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "proctor"
version = "0.1.0.dev0"
description = "Offline-testable coding task control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
proctor = "proctor.cli:main"

[tool.setuptools.packages.find]
include = ["proctor*"]
namespaces = true
